[project]
name = "persistence-baseline-negbinomial"
version = "1.0.0"
description = "Parametric persistence baseline for the Lao dengue forecasting case"

# Pinned to the patch, for the reason batch 2 pinned the analysis environment to the
# patch: `>=3.13,<3.14` resolves to whichever 3.13 the building machine happens to
# hold, and a version that depends on the machine is not a specification. 3.13.0 is
# the interpreter `environment/chapenv` runs on.
requires-python = "==3.13.0"

# The same two pins at the same versions as the sibling construction. The fork is about
# how uncertainty is wrapped around the point forecast; a different numpy on one side of
# it would be a second difference nobody asked for. The distribution is implemented from
# its own pmf rather than pulled in from scipy, so the environment stays the pool's --
# the ensemble runs its members in its own interpreter and checks that its pins cover
# every member's.
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
]
