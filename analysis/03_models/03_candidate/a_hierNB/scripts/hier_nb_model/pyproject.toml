[project]
name = "hier-nb-candidate"
version = "1.0.0"
description = "Hierarchical negative-binomial GLM for the Lao dengue forecasting case"

# Pinned to the patch, for the reason batch 2 pinned the analysis environment to the
# patch: `>=3.13,<3.14` resolves to whichever 3.13 the building machine happens to
# hold, and a version that depends on the machine is not a specification. 3.13.0 is
# the interpreter `environment/chapenv` runs on and the one both baselines pin.
requires-python = "==3.13.0"

# Exact pins, resolved into uv.lock beside this file. The same three that the
# baselines use, and nothing else: the fitter is Fisher scoring on a dense design
# matrix and needs a linear solve, which numpy has, and the log-gamma terms of the
# negative-binomial likelihood, which the standard library's math.lgamma has. A
# statistics package would be a large dependency for two functions, and a fitter
# nobody can read is not what this node is for.
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyyaml==6.0.3",
]
