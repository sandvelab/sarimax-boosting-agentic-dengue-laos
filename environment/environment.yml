# Declarative environment spec for the analysis (not the repository's own .venv machinery).
name: sarimax-residual-boosting
python: "3.13"
dependencies:
  - pandas          # data handling
  - numpy           # numerics
  - scipy           # stats (normal CDF/PDF for the closed-form CRPS)
  - statsmodels     # SARIMAX (stage 1)
  - properscoring   # independent CRPS reference, used only to verify our own implementation
  - scikit-learn    # tree-based stage-2 candidate (batch 5)
